openapi: 3.0.3
info:
  title: GEDv2 — Appairage ClearMyMails et destinations
  version: 2.0.0
  description: |
    Sections 1 et 2 du contrat `docs/api/cmm-ged.md`. Depuis la décision d'Olivier du 30-09, **la liaison
    part de la GED** ; CMM la valide.

    - Mon profil porte l'adresse mail de l'utilisateur, **vérifiée** par un lien envoyé à cette adresse.
    - « Relier ClearMyMails » crée un appairage **en attente 24 h** : un code d'échange à usage unique
      (aléa 256 bits, seule son empreinte est gardée) et un **code de vérification court** affiché à
      l'écran. La GED envoie à l'adresse vérifiée un courriel d'auto-configuration : en-tête
      `X-GED-Appairage: v1`, texte humain, pièce `ged-appairage.json`
      `{version, ged_url, ged_nom, compte, code, verification, expire_le}` (aucun code exécutable).
    - CMM affiche le code de vérification, l'utilisateur confirme, puis CMM échange `{code, verification,
      poste}` contre un jeton haché en base, révocable, lié au compte.
    - Les destinations sont décidées par la GED, dossier par dossier : `GET /api/v1/dossiers` ne liste
      QUE les dossiers où ce compte peut écrire (refus par défaut) ; déposer ailleurs est refusé 403 nommé.
servers:
  - url: http://127.0.0.1:8870
    description: Développement local
tags:
  - name: profil
    description: Adresse de profil, vérifiée par un lien
  - name: appairage
    description: Liaison d'une application tierce à un compte
  - name: destinations
    description: Dossiers où le compte du jeton peut déposer
paths:
  /profil:
    get:
      tags: [profil]
      summary: Mon profil (session normale)
      description: Adresse mail et son état, bouton « Relier ClearMyMails », appairages en attente, appareils reliés.
      responses:
        '200': { description: Écran Mon profil }
        '403': { description: Session absente ou insuffisante (nommé) }
  /profil/mail:
    post:
      tags: [profil]
      summary: Enregistrer l'adresse et envoyer le lien de vérification (session, CSRF)
      responses:
        '303': { description: Retour à Mon profil, courriel envoyé }
        '400': { description: Adresse invalide (nommé) }
        '502': { description: Courriel de vérification non remis (nommé) }
  /profil/mail/verifier:
    get:
      tags: [profil]
      summary: Consommer le lien de vérification reçu par courriel
      parameters:
        - { name: jeton, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: Adresse vérifiée, retour à Mon profil }
        '400': { description: Lien inconnu, déjà utilisé ou expiré (nommé) }
  /profil/appairage:
    post:
      tags: [appairage]
      summary: Relier ClearMyMails — crée l'appairage en attente et envoie l'auto-configuration (session, CSRF)
      responses:
        '303': { description: Appairage en attente ; le code de vérification est affiché }
        '400': { description: Adresse du profil non vérifiée (nommé) }
        '502': { description: Courriel d'auto-configuration non remis (nommé) }
  /api/v1/appairage/jeton:
    post:
      tags: [appairage]
      summary: Échanger {code, verification, poste} contre un jeton lié au compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verification, poste]
              properties:
                code: { type: string, description: Code d'échange reçu dans `ged-appairage.json` (256 bits) }
                verification: { type: string, example: K7M-4QX, description: Code court comparé par l'utilisateur }
                poste: { type: string, description: Nom du poste CMM, enregistré comme appareil appairé }
          application/x-www-form-urlencoded:
            schema: { type: object, required: [code, verification, poste] }
      responses:
        '200':
          description: Jeton remis une seule fois
          content:
            application/json:
              schema:
                type: object
                properties:
                  jeton: { type: string }
                  compte: { type: string }
                  ged_nom: { type: string }
                  expire_le: { type: string, nullable: true }
        '400':
          description: Code inconnu, expiré, déjà utilisé, code de vérification invalide ou poste absent
          content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
  /api/v1/appairage/moi:
    get:
      tags: [appairage]
      summary: Statut de la liaison
      responses:
        '200':
          description: Identité du compte du jeton et droits effectifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  compte: { type: string }
                  appareil: { type: string, nullable: true }
                  ged_nom: { type: string }
                  droits:
                    type: object
                    properties: { ingestion: { type: boolean } }
                  dossiers_ecriture: { type: integer }
        '401':
          description: Jeton absent, inconnu ou révoqué
          content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
    delete:
      tags: [appairage]
      summary: Révoquer la liaison côté CMM
      responses:
        '200':
          description: Révocation enregistrée (trace)
          content: { application/json: { schema: { type: object, properties: { revoque: { type: boolean } } } } }
        '401':
          description: Jeton absent, inconnu ou révoqué
          content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
  /api/v1/dossiers:
    get:
      tags: [destinations]
      summary: Dossiers où CE compte peut écrire
      parameters:
        - { name: parent, in: query, schema: { type: string, description: chemin du dossier parent ; vide = racine } }
      responses:
        '200':
          description: Enfants directs autorisés (un dossier sans droit n'apparaît jamais)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    chemin: { type: string }
                    nom: { type: string }
                    enfants: { type: boolean }
        '401':
          description: Jeton absent, inconnu ou révoqué
          content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
        '403':
          description: Jeton non lié à un compte
          content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } }
components:
  securitySchemes:
    jetonAppairage:
      type: http
      scheme: bearer
      description: Jeton lié au compte, remis une seule fois par `POST /api/v1/appairage/jeton`.
  schemas:
    Erreur:
      type: object
      required: [erreur]
      properties:
        erreur:
          type: object
          required: [etape, cause, reference]
          properties:
            etape: { type: string }
            cause: { type: string }
            reference: { type: string }
security:
  - jetonAppairage: []
